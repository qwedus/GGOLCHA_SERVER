name: Deploy to Seoul Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'   # server 폴더 변경될 때만 배포 (불필요한 트리거 방지)
      - 'web/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/GGOLCHA_SERVER
            OLD_REV=$(git rev-parse HEAD)
            git pull origin main
            NEW_REV=$(git rev-parse HEAD)

            cd web && npm install && npm run build
            cd ../server && docker compose up -d --build
            docker compose restart nginx

            if git -C ~/GGOLCHA_SERVER diff --name-only "$OLD_REV" "$NEW_REV" -- server/config/mosquitto.conf server/config/mosquitto.acl | grep -q .; then
              echo "mosquitto config changed — restarting mosquitto"
              docker compose restart mosquitto
            fi
