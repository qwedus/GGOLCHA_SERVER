name: monolith-v2

services:
  traefik:
    image: traefik:3.6.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80/tcp
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=30m"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=30m"
      - --entrypoints.websecure.address=:443/tcp
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - "--accessLog.format=json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./_data/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env

  init-log:
    image: busybox:latest
    command: sh -c "touch /log/server.log && chmod 666 /log/server.log && mkdir -p /files && chown 101:101 /files"
    volumes:
      - ./_log:/log:rw
      - ./_data/files:/files:rw
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    depends_on:
      init-log:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config
      - ./_log:/log:rw
      - ./_data/mosquitto:/mosquitto/data:rw
    networks:
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env

  mqtt-proxy:
    image: haproxy:3.1
    depends_on:
      - mosquitto
    volumes:
      - ./config/mqtt-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.31.2
    depends_on:
      init-log:
        condition: service_completed_successfully
    command: /bin/sh -c 'printf "%s" "$$ANNOUNCEMENT" > /tmp/announcement && exec nginx -g "daemon off;"'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monolith-v2.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.monolith-v2.entrypoints=websecure"
      - "traefik.http.routers.monolith-v2.tls=true"
      - "traefik.http.routers.monolith-v2.tls.certresolver=le"
      - "traefik.http.services.monolith-v2.loadbalancer.server.port=7000"
      - "traefik.http.routers.monolith-v2-upload.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api/files`)"
      - "traefik.http.routers.monolith-v2-upload.entrypoints=web"
      - "traefik.http.services.monolith-v2-upload.loadbalancer.server.port=7000"
      - "traefik.http.routers.monolith-v2.service=monolith-v2"
      - "traefik.http.routers.monolith-v2-upload.service=monolith-v2-upload"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web/dist:/var/public
      - ./_data/files:/var/files:rw
      - ./_log:/log:rw
    networks:
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env

  file-cleanup:
    image: busybox:latest
    command: sh -c 'while true; do sleep 300; find /var/files -type f -mmin +5 -delete; find /var/files -mindepth 1 -type d -empty -delete; done'
    volumes:
      - ./_data/files:/var/files:rw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  influxdb:
    image: influxdb:2.7
    volumes:
      - ./_data/influxdb:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=ggolcha
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    networks:
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mqtt-logger:
    build: ./mqtt_logger
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=honeycar
      - MQTT_PASSWORD=${HONEYCAR_MQTT_KEY}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=ggolcha
      - INFLUX_BUCKET=telemetry
    networks:
      - traefik
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik:
    external: true
